# Static-assets Worker that serves the Spuddy marketing site (web/) on
# spud.cherry.surf. Independent of the spuddy-server Worker, which keeps
# api.cherry.surf. No `main` script — this is an assets-only Worker.
name = "spuddy-site"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "spud.cherry.surf", custom_domain = true },
]

[assets]
directory = "."
