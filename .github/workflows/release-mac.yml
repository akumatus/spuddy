name: Release macOS client

# Cuts a macOS build and attaches the .dmg to a GitHub Release.
# Trigger by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`),
# or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create/upload the Release

jobs:
  build-mac:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # 22.12+ supports require(ESM), which electron-builder 26 needs
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Install dependencies
        # corepack picks the yarn version pinned by package.json's packageManager
        run: |
          corepack enable
          yarn install --immutable

      - name: Build renderer
        # electron-builder only packages the prebuilt dist/ — it does not run Vite.
        # Without this, the app ships with no dist/index.html and opens a blank
        # white window. (Mirrors the local `dist:mac` script's `vite build` step.)
        run: yarn build

      - name: Build and publish DMG
        # Signed with Developer ID and notarized by Apple, so the dmg opens without
        # the "damaged / unidentified developer" Gatekeeper prompt.
        # CSC_LINK / CSC_KEY_PASSWORD: electron-builder imports the .p12 into a
        # throwaway keychain. APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
        # activate the notarization step (an app-specific password, not the Apple
        # account password).
        # --publish always uploads the dmg to a draft GitHub Release for this tag.
        run: yarn electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization
        # electron-builder only *warns* and keeps going when the notarization env
        # vars are absent, so a green run can still ship an unnotarized app. Assert
        # the ticket is really stapled rather than trusting the exit code.
        run: |
          APP="$(find release -maxdepth 2 -name 'Spuddy.app' -print -quit)"
          test -n "$APP" || { echo "::error::no Spuddy.app in release/"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vv "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt \
            || { echo "::error::app is not notarized"; exit 1; }

      - name: Upload build artifact
        # Keeps the dmg on the workflow run too (handy for manual/dispatch runs).
        uses: actions/upload-artifact@v4
        with:
          name: spuddy-mac-dmg
          path: app/release/*.dmg
          if-no-files-found: error
