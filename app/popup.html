<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spuddy</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    /* transparent shell — the mirrored popup card paints everything visible */
    html, body { margin: 0; background: transparent; overflow: hidden; }
    /* Transparent headroom around the visible popup: room for the entrance
       animation AND for the card's soft CSS shadow to render without clipping
       at the window edge (the shadow reaches ~90px below the card). The popup
       stays centered in this headroom. */
    #proot {
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 90px;
    }
    /* The window is sized to the measured content, so the content must lay
       out at its natural size no matter what size the window happens to be
       at render time (it still has the PREVIOUS popup's size in that
       moment). Without this the flex shell squeezes the incoming card to
       the old window, and the squeezed size is what gets measured — a card
       opened after the weave stayed crushed (wrapped buttons), and the book
       opened after a card kept a horizontal scrollbar. */
    #proot > * { flex-shrink: 0; }
    /* viewport-relative caps are circular in a content-sized window; the
       popup bodies are fixed-size by design, so lift them here. (#proot
       prefix: vite hoists the bundled stylesheet below this inline block,
       so the overrides need the higher specificity to win.) */
    #proot #book { max-width: none; max-height: none; }
  </style>
</head>
<body>
  <div id="proot"></div>
  <script type="module" src="/src/popup-shell.ts"></script>
</body>
</html>
