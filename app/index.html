<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Positive Potato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="confetti"></div>

  <div id="stage" data-interactive>
    <div id="bubble" class="hidden"></div>
    <div id="mutter" class="hidden"></div>
    <div id="zz" class="hidden">z z</div>
    <div id="hearts"></div>
    <div id="emotes"></div>
    <div id="petclip">
      <canvas id="pet"></canvas>
    </div>
  </div>

  <div id="hoverpanel" data-interactive>
    <div id="said" class="hidden"></div>
    <div id="icons">
      <button id="bookBtn" title="Card Book">♥</button>
      <button id="buddiesBtn" title="buddies"><span class="zzlabel">z z</span><span class="peekhead"></span><i id="buddiesDot" class="hidden"></i></button>
      <button id="soundBtn" title="sound">♪</button>
      <button id="dbgDrawBtn" class="hidden" title="debug: draw again">🎲</button>
      <button id="dbgResetBtn" class="hidden" title="debug: reset all">↺</button>
    </div>
    <div id="chatrow">
      <input id="chatInput" type="text" autocomplete="off" spellcheck="false" />
      <span class="enter">↵</span>
    </div>
  </div>

  <div id="overlay" class="hidden" data-interactive>
    <div id="modal"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
