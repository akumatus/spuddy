<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="confetti"></div>

  <div id="stage" data-interactive>
    <div id="bubble" class="hidden"></div>
    <div id="mutter" class="hidden"></div>
    <div id="zz" class="hidden">z z</div>
    <div id="hearts"></div>
    <div id="emotes"></div>
    <div id="petclip">
      <canvas id="pet"></canvas>
    </div>
  </div>

  <div id="hoverpanel" data-interactive>
    <div id="said" class="hidden"></div>
    <div id="icons">
      <button id="bookBtn" title="Card Book">♥</button>
      <button id="buddiesBtn" title="buddies"><span class="peekclip"><span class="zzlabel">z z</span><span class="peekhead"></span></span><i id="buddiesDot" class="hidden"></i></button>
      <!-- ⚙ settings (design: Hover 图标重设计 §2) — solid stitched gear, turns 30° when open -->
      <button id="settingsBtn" title="settings">
        <svg class="gear" viewBox="0 0 64 64" aria-hidden="true">
          <g stroke="#A8905A" stroke-width="9" stroke-linecap="round">
            <path d="M51 32 L57 32"/><path d="M32 51 L32 57"/><path d="M13 32 L7 32"/><path d="M32 13 L32 7"/>
            <path d="M45.4 45.4 L49.7 49.7"/><path d="M18.6 45.4 L14.3 49.7"/><path d="M18.6 18.6 L14.3 14.3"/><path d="M45.4 18.6 L49.7 14.3"/>
          </g>
          <circle cx="32" cy="32" r="21" fill="#A8905A"/>
          <circle class="gearHole" cx="32" cy="32" r="8.5"/>
        </svg>
      </button>
      <div id="spanel" class="hidden"></div>
    </div>
    <div id="chatrow">
      <input id="chatInput" type="text" autocomplete="off" spellcheck="false" />
      <span class="enter">↵</span>
    </div>
  </div>

  <div id="overlay" class="hidden" data-interactive>
    <div id="modal"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
