name = "spuddy-server"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Custom domain the app talks to — *.workers.dev is DNS-poisoned in mainland
# China, so end users reach the Worker through here instead. Requires the
# cherry.surf zone to be active on this Cloudflare account.
routes = [
  { pattern = "api.cherry.surf", custom_domain = true }
]

# Daily card pre-generation.
# 16:00 UTC = 00:00 Asia/Shanghai. Adjust to taste — the batch is just
# overwritten each run, so timezone only affects "when the new pool appears".
[triggers]
crons = ["0 16 * * *"]

# KV: daily card batches (cards:current) + per-device quota counters (q:*).
# Create it once, then paste the id here:
#   wrangler kv namespace create SPUDDY_KV
[[kv_namespaces]]
binding = "KV"
id = "276e01a434db4d07a1576578862a45fe"

[vars]
# Which provider serves non-CN traffic: "deepseek" | "gemini" | "openai".
# On deepseek for now — it works globally and has credit; the Gemini key was
# out of quota. Flip to "gemini"/"openai" once that provider's billing is set.
INTL_PROVIDER = "deepseek"
# Provider the daily cron uses to knit card pools (kept fixed + cheap).
GEN_PROVIDER = "deepseek"
# Model ids per provider — override freely.
DEEPSEEK_MODEL = "deepseek-chat"
OPENAI_MODEL = "gpt-4o-mini"
GEMINI_MODEL = "gemini-2.0-flash"
# Per-device daily budget for real-time LLM calls (chat + golden weave combined).
CHAT_DAILY_LIMIT = "40"
# How many lines each persona's daily pool holds.
CARDS_PER_DAY = "24"
GOLDEN_PER_DAY = "10"

# Secrets — do NOT put these in this file. Set with `wrangler secret put NAME`:
#   DEEPSEEK_API_KEY   (CN traffic + cron generation)
#   GEMINI_API_KEY     (non-CN traffic, if INTL_PROVIDER=gemini)
#   OPENAI_API_KEY     (only if you switch INTL/GEN_PROVIDER to openai)
#   APP_TOKEN          (shared token the app sends as x-pp-app; optional soft gate)
#   ADMIN_TOKEN        (protects POST /admin/generate; falls back to APP_TOKEN)
