name = "spuddy-server"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Queryable request logs in the dashboard (Workers & Pages -> spuddy-server ->
# Observability). Free plan includes 200k events/day with 3-day retention —
# comfortably more than the 100k/day request ceiling, so sampling stays at 1.
# Without this there is no way to notice abuse until the provider bill lands:
# filter on status 429 to see the rate limit and the quota doing their work.
[observability]
enabled = true
head_sampling_rate = 1

# Custom domain the app talks to — *.workers.dev is DNS-poisoned in mainland
# China, so end users reach the Worker through here instead. Requires the
# cherry.surf zone to be active on this Cloudflare account.
routes = [
  { pattern = "api.cherry.surf", custom_domain = true }
]

# Daily card pre-generation — a FALLBACK now: the membership routine normally
# POSTs the batch each morning, and the scheduled handler skips generation when
# today's batch already exists (see worker.ts). So on normal days these cost one
# KV read and nothing else; they only spend API tokens on days the routine
# didn't run. One cron PER LANGUAGE, because one invocation's subrequest budget
# only fits one language's batch (~10 LLM calls vs the free plan's ~50-subrequest
# cap). 14:00 UTC = 22:00 Asia/Shanghai (evening, after the morning routine has
# had all day to run) generates English; 14:20 generates Chinese (the worker maps
# the expression via CRON_ZH — keep these in sync with src/worker.ts).
[triggers]
crons = []

# Per-IP burst guard for the metered endpoints (/chat, /distill, /consolidate,
# /golden, /greet). The daily quota meters deviceId, which the client invents and
# can rotate every request; the IP is the one identifier it cannot choose. Native
# rate limiting rather than another KV counter because the free plan allows only
# 1,000 KV writes a day and the quota counters already spend those.
#
# 20 per 60s per IP: a fast human conversation is well under 12/min (the app
# collapses a burst of typing into ONE request — see chatPending in chat.ts) and
# the background /distill and /consolidate calls share the same budget, so this
# sits roughly 2x above the busiest honest client. `period` accepts only 10 or 60.
[[ratelimits]]
name = "RT_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

# KV: daily card batches (cards:current) + live provider/model config
# (config:current, set via POST /admin/config) + the persistent quote/inet
# libraries. NOT the per-device quota counters — those moved to a Durable
# Object (below) because the free plan's 1,000 KV writes/day couldn't carry a
# write per successful reply. Create it once, then paste the id here:
#   wrangler kv namespace create SPUDDY_KV
[[kv_namespaces]]
binding = "KV"
id = "276e01a434db4d07a1576578862a45fe"

# Per-device daily quota counters — one Durable Object per deviceId
# (src/quota-do.ts, exported from worker.ts). Strongly consistent counting and
# no KV write budget spent; the free plan allows 100k DO requests/day and a
# chat reply spends two. Free-plan DOs must use the SQLite storage backend,
# hence new_sqlite_classes in the migration.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "DeviceQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceQuota"]

[vars]
# These are only DEFAULTS. The live provider/model is read from KV (config:current)
# on every request and can be flipped at runtime with no redeploy:
#   curl -XPOST https://api.cherry.surf/admin/config -H 'x-pp-admin: <ADMIN_TOKEN>' \
#     -d '{"chat":"anthropic","gen":"openai","models":{"anthropic":"claude-haiku-4-5-20251001"}}'
#   curl https://api.cherry.surf/admin/config -H 'x-pp-admin: <ADMIN_TOKEN>'   # read current
# config:current also carries "tuning" — client product knobs (gacha odds, mix
# rates, draw limit) served to the app on GET /cards, so the feel is adjustable
# without an app release: {"tuning":{"goldenBase":0.25,"goldenRamp":0.05,
# "weaveChance":0.1,"weavePity":8,"inetChance":0.8,"flavorChance":0.15,
# "drawLimit":3}}. POST replaces the WHOLE config — GET first, merge, resend.
# Absent keys leave the app on its built-in defaults (app/src/app/gacha.ts).
# Provider values: "openai" | "gemini" | "deepseek" | "anthropic" (alias "claude").
#
# No geo routing — every request uses the same ordered fallback chain
# (anthropic -> openai -> gemini -> deepseek, see PROVIDER_FALLBACK in providers.ts).
# These two just pick the PRIMARY each chain starts from; on failure the call
# walks down the rest of the chain automatically.
#
# Primary provider for real-time chat / greeting / golden card.
CHAT_PROVIDER = "openai"
# Primary provider the daily cron uses to knit card pools.
GEN_PROVIDER = "anthropic"
# Model ids per provider — override here, or per-request via config:current.models.
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"
OPENAI_MODEL = "gpt-5.6-luna"
GEMINI_MODEL = "gemini-3.1-flash-lite"
DEEPSEEK_MODEL = "deepseek-v4-flash"
# Per-device daily budget for real-time LLM calls (chat/distill/consolidate/
# golden/greet share it). DEFAULT only — override live with no redeploy via
#   curl -XPOST .../admin/config -H 'x-pp-admin: TOKEN' -d '{"chatLimit":50, ...}'
# (POST replaces the whole config — resend chat/gen/models along with it).
CHAT_DAILY_LIMIT = "50"
# Pool sizes. CARDS_PER_DAY is the SHARED generated normal pool (voice-neutral —
# every persona draws from it). Small since 2026-07: generation covers the
# three kept genres (dare + joke + one lean sincere pass, ~14 lines each,
# ~20% of draws combined); the bulk of normal draws comes from the persistent
# internet-line pool (inet:<lang>), so heavy users lapping this little batch
# is fine. Also caps how many normal lines /admin/put will store. (Goldens are
# drawn live or from the curated famous-quote pool.)
CARDS_PER_DAY = "42"
# Mutters (private inner-monologue) per mood (watch/alone/lonely) per persona.
MUTTERS_PER_DAY = "16"
# Cap on the persistent famous-quote library (quotes:<lang>). The daily routine
# appends new lines via /admin/quotes; past this many, the oldest drop off.
# Generous (attributed famous lines are the good stuff — keep them): at the
# hunt's ~10-20 adds/day this is years of headroom, and /cards only ships a
# QUOTES_WINDOW slice per day so the payload never grows with the cap.
QUOTES_LIB_MAX = "5000"
# Cap on the persistent internet-line pool (inet:<lang>) — the normal card's
# ambient-encouragement source. The daily routine appends its no-source finds
# via /admin/inet (the low-provenance half of the quote hunt); the maintainer
# can hand-add through the same door (seed: scripts/internet-lines.*.txt).
# Same oldest-drop trim, so the pool is a rolling daily-refreshed window.
INET_LIB_MAX = "1000"
# Daily window sizes: GET /cards serves this many lines of each persistent pool
# per day (a stable-shuffled rotating page — see quotes-store.ts dailyWindow),
# so clients get a fresh light payload daily instead of the whole library.
# Sized well above any realistic day's draws so the app's no-repeat logic
# never laps a window mid-day.
QUOTES_WINDOW = "150"
INET_WINDOW = "200"
# Small generation calls per pool per day — several small batches, each with
# its own random inspiration seeds, beat one long call that templates out.
# Must match the weight-expanded CARD_GENRES pass count (dare + joke + sincere
# = 3) so every call lands one focused genre; ~14 normal lines per call keeps
# quality up. Only the cron fallback uses this; the membership routine follows
# the playbook.
GEN_RUNS = "3"

# Secrets — do NOT put these in this file. Set with `wrangler secret put NAME`:
#   ANTHROPIC_API_KEY  (primary — chat + cron generation default to anthropic, alias "claude")
#   OPENAI_API_KEY     (fallback #2 in the chain)
#   GEMINI_API_KEY     (fallback #3 in the chain)
#   DEEPSEEK_API_KEY   (fallback #4 in the chain)
#   APP_TOKEN          (shared token the app sends as x-pp-app; optional soft gate)
#   ADMIN_TOKEN        (protects POST /admin/generate; falls back to APP_TOKEN)
# A backend with no key set is skipped automatically — the chain falls through to
# the next provider that has one, so you only need keys for the ones you use.
